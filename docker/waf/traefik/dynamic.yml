# Traefik dynamic configuration — WAF eSign.
#
# Hot-reloaded (`providers.file.watch: true`), so certificate rotation is a file
# copy into WAF_TLS_DIR plus, at most, an edit here. No restart needed.
#
# Certificates are WAF's own, supplied out of band. There is no ACME resolver:
# nothing renews these automatically, so track the expiry date somewhere a human
# will see it.

http:
  routers:
    esign:
      rule: 'Host(`esign.waf.com.fj`)'
      entryPoints:
        - websecure
      service: esign
      middlewares:
        - security-headers
      tls: {}

  services:
    esign:
      loadBalancer:
        servers:
          - url: 'http://esign:3000'
        # The app builds absolute URLs for signing links and reads the incoming
        # host; it must see the public hostname, not the container name.
        passHostHeader: true

  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # No stsPreload. Preloading is effectively irreversible and should be a
        # deliberate decision, not a side effect of a deployment config.
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        # No Content-Security-Policy here on purpose — the app emits its own,
        # nonce-based (see `useCspNonce` / root.tsx). A second CSP header would
        # intersect with it and break the signing UI.

tls:
  options:
    # `default` is applied to every router that does not name a TLS option.
    #
    # Traefik v3 already refuses TLS 1.0 and 1.1 — verified by probing a running
    # instance — so this changes nothing today. It is here so that a future
    # change to Traefik's default cannot lower the floor without anyone noticing.
    #
    # Cipher suites are left to Go's defaults, which are sound and track the
    # runtime. Pinning a list here would freeze it at whatever was current when
    # this file was written.
    default:
      minVersion: VersionTLS12
      # sniStrict is deliberately off: it would reject clients that send no SNI,
      # which is precisely what the defaultCertificate below exists to serve.
      sniStrict: false

  certificates:
    - certFile: /etc/traefik/certs/esign.waf.com.fj.crt
      keyFile: /etc/traefik/certs/esign.waf.com.fj.key

  stores:
    default:
      # Serves this certificate for any request whose SNI matches no other
      # certificate, so a request to a bare IP or a stale DNS name gets a clean
      # TLS error rather than Traefik's self-signed default.
      defaultCertificate:
        certFile: /etc/traefik/certs/esign.waf.com.fj.crt
        keyFile: /etc/traefik/certs/esign.waf.com.fj.key
