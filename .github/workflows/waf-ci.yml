# WAF eSign CI.
#
# Separate from upstream's `ci.yml` rather than an edit to it: that file targets
# `main` and gets replaced wholesale on an upstream sync. This one is ours and
# will not conflict.
#
# E2E is deliberately absent. Upstream's `e2e-tests.yml` needs Warp's 8-core
# runners plus Postgres and Inbucket services; on `ubuntu-latest` it is slow
# enough to stop being a useful gate. Add it as a nightly job when there is a
# reason to.
name: WAF CI

on:
  push:
    branches: ['waf/main']
  pull_request:
    branches: ['waf/main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege, declared rather than inherited. Without this the jobs get the
# repository's default token scopes, which on older repositories is read/write
# across the board — and that token is in scope for `npm ci`, which runs
# dependency lifecycle scripts. Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-install

      - name: Biome
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-install

      # The app reads configuration at runtime, but the build still needs the
      # variables to exist. Example values are enough — nothing here is deployed.
      - name: Copy env
        run: cp .env.example .env

      # No separate typecheck job: `apps/remix/.bin/build.sh` runs `build:app`,
      # which is `npm run typecheck && react-router build`. A standalone job
      # would run tsc twice for the same signal.
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the image still builds before anything is published. Publishing
      # itself lives in waf-publish.yml and runs only on waf/main.
      #
      # Cache is scoped to `ci` so this job and the publish job never share
      # layers. GitHub already isolates caches by ref — a pull request writes to
      # its own scope and cannot write into the base branch's — so a PR cannot
      # reach the published image through the cache. An explicit scope means we
      # are not relying on that platform detail staying true, and it costs
      # nothing: each workflow simply warms its own cache.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=ci
          # Only publish cache from trusted pushes, never from pull requests.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=ci,mode=max' || '' }}
